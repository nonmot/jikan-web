services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      JIKAN_DB_PATH: /data/database.db
    volumes:
      - ${JIKAN_DB_HOST_PATH}:/data/database.db:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
